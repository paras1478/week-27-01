name: Deploy the backend 
on: 
    push: 
       branches:  [main]
    jobs: 
    build:
       steps: 
          - name:  checkout the code
            uses:  docker/login-action@v2
            with: 
               username: ${{secrets.DOCKERHUB_USERNAME}}
               password: ${{secrets.DOCKERHUB_TOKEN}}

          - name: build and push
            uses: docker/build-push-action@v4
            with: 
                context:
                file: ./docker/Dockerfile.websocket
                push:  true  
                tages: pankaj/todo-app-websocket:${{ github.sha}} 
          - name: Deploy to the VM
            run: |
              echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/ssh_key
              mkdir -p /home/runner/.ssh
              ls /home/runner/.ssh
              chmod 700 /home/runner/ssh_key
              ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@64.227.169.180 -t "docker stop user_backend && docker run --name user_backend -d -p 8080:8080 pankaj/todo-app-websocket:${{ github.sha}} "
   